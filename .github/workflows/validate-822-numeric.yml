name: Generate reviewed Archify 822 numeric ZIP
on:
  push:
    branches: [validation/archify822-numeric-generate-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: rudycelekli/archify
          ref: 91797ad83dd871e08ae1a443b2769eece2d6d9e3
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
      - name: Verify exact source and canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 91797ad83dd871e08ae1a443b2769eece2d6d9e3
          mkdir -p proof
          node -p 'JSON.stringify({source:"91797ad83dd871e08ae1a443b2769eece2d6d9e3",node:process.versions.node,zlib:process.versions.zlib,platform:process.platform})' | tee proof/runtime.json
          node -e 'if(process.versions.node!=="22.23.2" || process.versions.zlib!=="1.3.1-e00f703" || process.platform!=="linux")process.exit(1)'
      - name: Record affected responsibility from actual candidate paths
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {classifyPaths} from "./scripts/ci-scope.mjs"; const p=classifyPaths(["archify/renderers/shared/svg-path-analysis.mjs","archify/scripts/check-render-output.mjs","test/svg-path-analysis.test.mjs","test/svg-path-checker.test.mjs","archify.zip"]); console.log(JSON.stringify(p)); if(p.scope!=="full"||JSON.stringify(p.owners)!=="[\"renderer\"]"||!p.generated||!p.browser||!p.package||!p.windows||!p.webm||!p.manifest||!p.website)process.exit(1)' | tee proof/scope.json
      - name: Build twice from clean tracked source and compare
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-zip.sh "$RUNNER_TEMP/822-first.zip" | tee proof/build-first.log
          scripts/build-zip.sh "$RUNNER_TEMP/822-second.zip" | tee proof/build-second.log
          cmp "$RUNNER_TEMP/822-first.zip" "$RUNNER_TEMP/822-second.zip"
          cp "$RUNNER_TEMP/822-first.zip" proof/archify.zip
          sha256sum proof/archify.zip archify.zip | tee proof/digests.txt
          if cmp -s proof/archify.zip archify.zip; then
            echo 'Existing source archive already matches.' | tee proof/previous-archive-state.txt
          else
            echo 'Existing source archive is stale at this reviewed candidate; regenerated archive retained for independent entry diff.' | tee proof/previous-archive-state.txt
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: archify822-generated-zip
          path: proof
          if-no-files-found: error
          retention-days: 7
