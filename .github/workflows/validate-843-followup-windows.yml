name: Validate Archify 843 followup Windows Node 22

on:
  push:
    branches: [validation/archify843-followup-windows-20261011]
    paths: [.github/workflows/validate-843-followup-windows.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node22:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: rudycelekli/archify
          ref: e3787be4c09c26ba439fb82c7bcb42bbe98c213b
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.3
      - name: Verify exact source and native runner
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne 'e3787be4c09c26ba439fb82c7bcb42bbe98c213b') { throw 'Unexpected source head' }
          $platform = node -p 'process.platform'
          $version = node -p 'process.version'
          if ($platform -ne 'win32' -or $version -ne 'v22.23.3') { throw 'Unexpected native runtime' }
          New-Item -ItemType Directory -Path validation-proof | Out-Null
          @{ source_head = $head; platform = $platform; node = $version; runner_os = $env:RUNNER_OS; workflow_sha = $env:GITHUB_SHA; test = 'test/route-automatic-label-proximity.test.mjs' } | ConvertTo-Json | Set-Content validation-proof/runtime.json
      - name: Run Architecture caller and helper tests
        shell: pwsh
        run: |
          node --test --test-reporter=tap test/route-automatic-label-proximity.test.mjs 2>&1 | Tee-Object -FilePath validation-proof/test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          $log = Get-Content validation-proof/test.log -Raw
          if ($log -notmatch '(?m)^# pass 2\s*$' -or $log -notmatch '(?m)^# skipped 0\s*$') { throw 'Expected test did not execute successfully' }
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: archify-843-followup-windows-node22-proof
          path: validation-proof/
          if-no-files-found: error
          retention-days: 7
